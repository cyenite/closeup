<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Cantarell, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c92a0"/>
    </marker>
    <marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffc400"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="18" fill="#0d0e12"/>

  <text x="40" y="44" fill="#e6e8ee" font-size="18" font-weight="700">How Closeup works</text>
  <text x="40" y="68" fill="#8c92a0" font-size="13">Frames flow left to right; keys and the overlay talk to GNOME Shell over D-Bus.</text>

  <!-- capture lane -->
  <rect x="40" y="100" width="150" height="86" rx="10" fill="#1d2029" stroke="#343846"/>
  <text x="115" y="134" fill="#e6e8ee" font-size="14" font-weight="700" text-anchor="middle">Shared window</text>
  <text x="115" y="154" fill="#8c92a0" font-size="12" text-anchor="middle">or whole screen</text>
  <text x="115" y="172" fill="#8c92a0" font-size="12" text-anchor="middle">(your real desktop)</text>

  <rect x="230" y="100" width="150" height="86" rx="10" fill="#1d2029" stroke="#343846"/>
  <text x="305" y="134" fill="#e6e8ee" font-size="14" font-weight="700" text-anchor="middle">Capture</text>
  <text x="305" y="154" fill="#8c92a0" font-size="12" text-anchor="middle">portal + PipeWire</text>
  <text x="305" y="172" fill="#8c92a0" font-size="12" text-anchor="middle">frames + cursor</text>

  <rect x="420" y="100" width="150" height="86" rx="10" fill="#26230f" stroke="#ffc400"/>
  <text x="495" y="134" fill="#ffc400" font-size="14" font-weight="700" text-anchor="middle">Camera</text>
  <text x="495" y="154" fill="#c9ccd6" font-size="12" text-anchor="middle">zoom around cursor</text>
  <text x="495" y="172" fill="#c9ccd6" font-size="12" text-anchor="middle">dead zone, springs</text>

  <rect x="610" y="100" width="150" height="86" rx="10" fill="#1d2029" stroke="#343846"/>
  <text x="685" y="134" fill="#e6e8ee" font-size="14" font-weight="700" text-anchor="middle">Renderer</text>
  <text x="685" y="154" fill="#8c92a0" font-size="12" text-anchor="middle">wgpu, bicubic</text>
  <text x="685" y="172" fill="#8c92a0" font-size="12" text-anchor="middle">sharp cursor sprite</text>

  <rect x="800" y="100" width="120" height="86" rx="10" fill="#1d2029" stroke="#343846"/>
  <text x="860" y="134" fill="#e6e8ee" font-size="14" font-weight="700" text-anchor="middle">Stage</text>
  <text x="860" y="154" fill="#8c92a0" font-size="12" text-anchor="middle">16:9 window</text>
  <text x="860" y="172" fill="#8c92a0" font-size="12" text-anchor="middle">you share this</text>

  <path d="M190 143 H226" stroke="#8c92a0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M380 143 H416" stroke="#8c92a0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M570 143 H606" stroke="#8c92a0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M760 143 H796" stroke="#8c92a0" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="800" y="226" width="120" height="58" rx="10" fill="#1d2029" stroke="#343846" stroke-dasharray="5 4"/>
  <text x="860" y="252" fill="#e6e8ee" font-size="13" font-weight="700" text-anchor="middle">Zoom, Meet,</text>
  <text x="860" y="270" fill="#e6e8ee" font-size="13" font-weight="700" text-anchor="middle">Teams...</text>
  <path d="M860 186 V222" stroke="#8c92a0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- control lane -->
  <rect x="40" y="316" width="250" height="110" rx="10" fill="#1d2029" stroke="#343846"/>
  <text x="58" y="344" fill="#e6e8ee" font-size="14" font-weight="700">Keyboard service</text>
  <text x="58" y="366" fill="#8c92a0" font-size="12">evdev grab + uinput replay</text>
  <text x="58" y="384" fill="#8c92a0" font-size="12">bare 1-9 zoom, unless you're typing</text>
  <text x="58" y="402" fill="#8c92a0" font-size="12">every other key passes through</text>

  <rect x="350" y="316" width="410" height="110" rx="10" fill="#1d2029" stroke="#343846"/>
  <text x="368" y="344" fill="#e6e8ee" font-size="14" font-weight="700">GNOME Shell extension</text>
  <text x="368" y="366" fill="#8c92a0" font-size="12">draws the outline + controls strip outside the shared area</text>
  <text x="368" y="384" fill="#8c92a0" font-size="12">owns Ctrl+Alt shortcuts, answers "is a text field focused?"</text>
  <text x="368" y="402" fill="#8c92a0" font-size="12">brings the source picker to the front</text>

  <path d="M165 316 C165 260 420 250 470 190" stroke="#ffc400" stroke-width="2" fill="none" marker-end="url(#accent)"/>
  <text x="58" y="300" fill="#ffc400" font-size="12">zoom keys</text>
  <path d="M520 312 V190" stroke="#ffc400" stroke-width="2" marker-end="url(#accent)" marker-start="url(#accent)"/>
  <text x="530" y="262" fill="#ffc400" font-size="12">D-Bus: shortcuts in, visible region out</text>
  <path d="M290 371 H346" stroke="#8c92a0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="296" y="363" fill="#8c92a0" font-size="11">typing?</text>
</svg>
